services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: insightboard-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - app-storage:/var/www/storage/app/private
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_DATABASE=insightboard
      - DB_USERNAME=insightboard_user
      - DB_PASSWORD=insightboard_secret
      - QUEUE_CONNECTION=database
      - ANALYTICS_SERVICE_URL=http://analytics:8000
      - ANALYTICS_SERVICE_TOKEN=insightboard-secret-analytics-token-2026
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_started
    networks:
      - insightboard-net

  web:
    image: nginx:alpine
    container_name: insightboard-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - insightboard-net

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: insightboard-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - .:/var/www
      - app-storage:/var/www/storage/app/private
    environment:
      - APP_ENV=local
      - DB_HOST=db
      - DB_DATABASE=insightboard
      - DB_USERNAME=insightboard_user
      - DB_PASSWORD=insightboard_secret
      - QUEUE_CONNECTION=database
      - ANALYTICS_SERVICE_URL=http://analytics:8000
      - ANALYTICS_SERVICE_TOKEN=insightboard-secret-analytics-token-2026
    depends_on:
      - app
      - db
      - analytics
    networks:
      - insightboard-net

  analytics:
    build:
      context: ./python-analytics
      dockerfile: Dockerfile
    container_name: insightboard-analytics
    restart: unless-stopped
    environment:
      - APP_ENV=local
      - ANALYTICS_SERVICE_TOKEN=insightboard-secret-analytics-token-2026
      - MAX_UPLOAD_SIZE_MB=50
      - MAX_ROWS=100000
      - MAX_COLUMNS=100
    networks:
      - insightboard-net

  db:
    image: mysql:9.3
    container_name: insightboard-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: insightboard
      MYSQL_USER: insightboard_user
      MYSQL_PASSWORD: insightboard_secret
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - insightboard-net

networks:
  insightboard-net:
    driver: bridge

volumes:
  db-data:
  app-storage:

